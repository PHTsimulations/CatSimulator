name: Build NumWorks NWA
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install nwlink
        run: npm install -g nwlink
      - name: Build NWA
        run: make
      - name: Upload NWA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Microsoft-Cat-Simulator-NWA
          path: build/CatSimulator.nwa
